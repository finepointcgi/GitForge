# Publishes a release when a version tag is pushed:  git tag v0.2.0 && git push origin v0.2.0
# Installed copies of GitForge find it through the GitHub releases feed (see docs/RELEASING.md).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write      # create the release and upload assets
  id-token: write      # sign build provenance
  attestations: write  # store build provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags and history for the release notes
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Read the version from the tag
        id: version
        shell: pwsh
        run: |
          if ($env:TAG -notmatch '^v(\d+\.\d+\.\d+)(-[0-9A-Za-z.-]+)?$') { throw "Tag '$env:TAG' is not vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease." }
          "version=$($Matches[1])$($Matches[2])" >> $env:GITHUB_OUTPUT
          "prerelease=$(if ($Matches[2]) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test --solution GitForge.slnx -c Release

      - name: Publish the desktop app
        run: dotnet publish src/GitForge.Desktop -c Release -r win-x64 --self-contained -p:PublishReadyToRun=true -p:Version=${{ steps.version.outputs.version }} -o publish

      - name: Write release notes
        shell: pwsh
        run: |
          $previous = git tag --merged HEAD --list 'v*' --sort=-v:refname | Where-Object { $_ -ne $env:TAG } | Select-Object -First 1
          $range = if ($previous) { "$previous..$env:TAG" } else { $env:TAG }
          $changes = git log $range --no-merges --format='- %s'
          @("## Changes", '') + $changes | Set-Content -Encoding utf8 release-notes.md

      - name: Restore vpk
        run: dotnet tool restore

      # The previous release lets vpk build a small delta package. The first release has none to download.
      - name: Download the previous release
        continue-on-error: true
        run: dotnet vpk download github --repoUrl ${{ env.REPO_URL }} --token ${{ secrets.GITHUB_TOKEN }} -o releases

      - name: Pack
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          $vpk = @(
            'pack', '--packId', 'GitForge', '--packVersion', $env:VERSION, '--packDir', 'publish', '--mainExe', 'GitForge.exe', '-r', 'win-x64',
            '--packTitle', 'GitForge', '--packAuthors', 'GitForge Contributors', '--icon', 'src/GitForge.Desktop/Assets/GitForge.ico',
            '--releaseNotes', 'release-notes.md', '--shortcuts', 'StartMenuRoot', '--msi', '--outputDir', 'releases')
          if ($env:SIGNING_PFX_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
            $vpk += @('--signParams', "/f `"$pfx`" /p `"$env:SIGNING_PASSWORD`" /fd sha256 /tr http://timestamp.digicert.com /td sha256")
          } else {
            Write-Output '::warning::WINDOWS_SIGNING_PFX_BASE64 is not set, so this release is unsigned. Windows SmartScreen and application control policies may block it.'
          }
          dotnet vpk @vpk
          $code = $LASTEXITCODE
          if ($pfx) { Remove-Item $pfx -Force }
          exit $code

      - name: Upload the release
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $vpk = @('upload', 'github', '--repoUrl', $env:REPO_URL, '--token', $env:GH_TOKEN, '-o', 'releases',
                   '--publish', '--releaseName', "GitForge $env:VERSION", '--tag', $env:TAG)
          if ($env:PRERELEASE -eq 'true') { $vpk += '--pre' }
          dotnet vpk @vpk
          exit $LASTEXITCODE

      # This version's installer, MSI, portable zip, packages, and release index (not the previous release's files).
      - name: Collect this release's files
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Get-ChildItem releases -File |
            Where-Object { $_.Name -like 'GitForge-win*' -or $_.Name -like "GitForge-$env:VERSION-*.nupkg" -or $_.Name -eq 'releases.win.json' } |
            Copy-Item -Destination dist

      - name: Upload checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = Get-ChildItem dist -File | Sort-Object Name
          $files | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" } | Set-Content -Encoding ascii SHA256SUMS.txt
          gh release upload $env:TAG SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --clobber
          exit $LASTEXITCODE

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
